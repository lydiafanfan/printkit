<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>打印助手</title>
  <meta name="theme-color" content="#f7f6f3">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div class="shell">
  <!-- 左侧导航 -->
  <aside class="side" id="side">
    <a class="brand" href="#/">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg></span>
      <span><b>打印助手</b><small>PrintKit</small></span>
    </a>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-foot"><span class="printer-tag"><i></i>Bambu Lab P1S · 256³ mm</span>模型在本机生成，不上传文件</div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <!-- 首页 -->
    <section id="home" class="home" hidden></section>

    <!-- 工具页 -->
    <section id="studio" class="studio" hidden>
      <header class="toolbar">
        <button class="tb-btn only-narrow" id="menuBtn" aria-label="菜单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="tb-title">
          <span class="t-ico" id="barIco"></span>
          <div><b id="barName"></b><small id="barSub"></small></div>
        </div>
        <div class="tb-group">
          <button class="tb-btn" id="viewReset" data-tip="重置视角 · F"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
          <button class="tb-btn" id="viewTop" data-tip="俯视 · T"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="12" cy="12" r="2.5"/></svg></button>
          <button class="tb-btn" id="viewFlip" data-tip="翻面查看 · R"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M8 7L4 12l4 5"/><path d="M16 7l4 5-4 5"/></svg></button>
          <span class="tb-sep"></span>
          <div class="swatches" id="swatches" aria-label="预览颜色"></div>
        </div>
        <div class="dl">
          <div class="fmt" id="fmtSeg" data-tip="3MF：零件分开，Bambu Studio 可直接分色"><button data-fmt="3mf">3MF</button><button data-fmt="stl">STL</button></div>
          <button class="btn-primary" id="download" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
            <span>下载</span><kbd id="kbdSave">⌘S</kbd>
          </button>
        </div>
      </header>

      <div class="work">
        <div class="canvas-wrap">
          <div class="viewport" id="viewport">
            <div class="vp-busy" id="busy"><span class="dots"><i></i><i></i><i></i></span>生成中</div>
            <div class="vp-error" id="vpError" hidden></div>
            <div class="status">
              <span class="st-item" id="vpDims"></span>
              <span class="st-item muted" id="exSub"></span>
              <button class="st-warn" id="stWarn" hidden></button>
              <span class="st-hint">拖动旋转 · 滚轮缩放 · 右键平移</span>
            </div>
            <button class="fab" id="fab" disabled aria-label="下载 STL">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span id="fabFmt">3MF</span>
            </button>
          </div>
        </div>
        <aside class="inspector" id="panel"></aside>
      </div>
    </section>
  </div>
</div>

<span id="exDims" hidden></span>
<input type="file" id="meshIn" accept=".stl,.obj" multiple hidden>
<dialog id="modal" class="modal"></dialog>
<input type="file" id="fileIn" accept=".svg,image/svg+xml,image/png,image/jpeg,image/webp" hidden>
<div class="drop-veil" id="dropVeil"><div>松开鼠标，用这张图</div></div>
<script type="module" src="js/app.js?v=8"></script>
</body>
</html>
